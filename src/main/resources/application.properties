face-ai.base-url=http://127.0.0.1:8002
face-ai.api-key=doi-thanh-chuoi-bi-mat-cua-ban-123456

# SMPT EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Attendance Configuration
attendance.start-work=08:30
attendance.max-check-in-time=10:00
attendance.min-check-out-time=16:00
attendance.end-work=17:30

attendance.auto-mark-absent-cron=0 0 10 * * *
attendance.auto-handle-missing-checkout-cron=0 50 23 * * *


# Leave Request Auto-Reject Configuration
attendance.leave.auto-reject-cron=0 0 22 * * *
attendance.leave.blackout-minutes=2

# Storage Configuration
app.storage.upload-dir=uploads

# Catch exception
# server.error.include-message=never
# server.error.include-binding-errors=never
# server.error.include-stacktrace=never
# server.error.include-exception=false

app.timezone=Asia/Ho_Chi_Minh

# Face ID Configuration
face-id.api-key=${FACE_ID_API_KEY:dev-secret-key-change-in-production}
face-id.confidence-threshold=0.55

spring.config.import=optional:file:.env[.properties]