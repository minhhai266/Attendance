<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh bằng Face ID</title>
    <link href="/css/attendance/attendance-check.css" rel="stylesheet">
    <link href="/css/attendance/attendance-check-offline.css" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <a href="/home">MyApp</a>
            </div>
            <div class="header-info">
                <h1 class="header-title">Điểm danh bằng Face ID</h1>
                <div class="header-time" id="currentDate">--</div>
            </div>
        </div>
        <div class="header-right">
            <div class="header-clock" id="clock">00:00:00</div>
            <button class="header-btn theme-toggle" id="themeToggle" type="button">🌙</button>
        </div>
    </header>

    <div class="container">
        <main class="container-attend-main">
            <section class="scanner-card">
                <div class="scan-frame">
                    <video id="camera" autoplay playsinline muted></video>
                    <canvas id="overlay"></canvas>
                </div>

                <div class="result-card" id="attendanceMessage" style="display:none;"></div>

                <!-- Chế độ Online: quét AI tự động (giữ nguyên như cũ) -->
                <div class="capture-bar" id="onlineControls">
                    <button id="btnCaptureAttendance" class="header-btn btn-action btn-secondary" type="button">📸 Quét điểm danh</button>
                    <button id="btnToggleCamera" class="header-btn btn-action btn-secondary" type="button">📹 Mở camera</button>
                </div>

                <!-- Chế độ Offline: mất kết nối AI -->
                <div class="offline-panel hidden" id="offlinePanel">
                    <div class="offline-message">⚠️ Không thể kết nối hệ thống nhận diện AI. Bạn có thể điểm danh thủ công bằng cách chọn tên bên dưới.</div>
                    <div class="offline-actions">
                        <button id="btnReconnect" class="header-btn btn-action btn-primary" type="button">🔄 Kết nối lại</button>
                    </div>
                    <div class="employee-search">
                        <input type="text" id="employeeSearch" placeholder="Tìm theo tên hoặc mã nhân sự...">
                    </div>
                    <div class="employee-list" id="employeeList">
                        <div class="employee-empty">Đang tải danh sách nhân viên...</div>
                    </div>
                </div>

                <!-- Chế độ Offline: đã chọn nhân viên, chờ chụp ảnh -->
                <div class="manual-controls hidden" id="manualControls">
                    <div class="selected-badge" id="selectedEmployeeBadge">Đã chọn: --</div>
                    <div class="manual-btn-row">
                        <button id="btnManualCapture" class="header-btn btn-action btn-primary" type="button">📸 Chụp & điểm danh</button>
                        <button id="btnBackToList" class="header-btn btn-action btn-secondary" type="button">↩ Chọn lại</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/api/method.js"></script>
    <script src="/js/attendance/attendance-check.js"></script>
</body>

</html>
