<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh bằng Face ID</title>
    <link href="/css/attendance/attendance-check.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px); /* trừ chiều cao header, chỉnh lại nếu header khác 70px */
        }
        .container-attend-main {
            flex: 1;
            display: flex;
        }
        .scanner-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .scan-frame {
            flex: 1;
            position: relative;
        }
        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .capture-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 14px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <a href="/home">MyApp</a>
            </div>
            <div class="header-info">
                <h1 class="header-title">Điểm danh bằng Face ID</h1>
                <div class="header-time" id="currentDate">--</div>
            </div>
        </div>
        <div class="header-right">
            <div class="header-clock" id="clock">00:00:00</div>
            <button class="header-btn theme-toggle" id="themeToggle" type="button">🌙</button>
        </div>
    </header>

    <div class="container">
        <main class="container-attend-main">
            <section class="scanner-card">
                <div class="scan-frame">
                    <video id="camera" autoplay playsinline muted></video>
                    <canvas id="overlay"></canvas>
                </div>
                <div class="result-card" id="attendanceMessage" style="display:none;"></div>
                <div class="capture-bar">
                    <button id="btnCaptureAttendance" class="header-btn" type="button" style="width:auto;height:auto;padding:14px 20px;border-radius:12px;font-weight:700;">📸 Quét điểm danh</button>
                    <button id="btnToggleCamera" class="header-btn" type="button" style="width:auto;height:auto;padding:14px 20px;border-radius:12px;font-weight:700;">📹 Mở camera</button>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/api/method.js"></script>
    <script src="/js/attendance/attendance-check.js"></script>
</body>

</html>
