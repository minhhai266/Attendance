<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="detailModal"
      th:remove="tag">

<div id="attendanceDetailModal" class="detail-modal-overlay" style="display: none;">
    <div class="detail-modal">
        <div class="detail-modal-header">
            <h2>Chi tiết điểm danh</h2>
            <button type="button" class="detail-modal-close" onclick="closeAttendanceDetail()">&times;</button>
        </div>
        <div class="detail-modal-body">
            <div id="attendanceDetailLoading" class="detail-loading">
                <p style="color: var(--text-gray); text-align: center;">Đang tải...</p>
            </div>
            <div id="attendanceDetailContent" class="detail-content" style="display: none;">
                <!-- Nội dung được render bởi attendance-detail.js -->
            </div>
        </div>
        <div class="detail-modal-footer">
            <button type="button" onclick="closeAttendanceDetail()">Đóng</button>
        </div>
    </div>
</div>

</html>
