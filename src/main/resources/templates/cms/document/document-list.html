<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Danh sách báo cáo</title>
    <link rel="stylesheet" th:href="@{/css/document/document-list.css}">

</head>

<body>
    <div class="bg-image"></div>
    <div class="layout">
        <div th:replace="~{cms/sidebar/sidebar-role :: sidebar}"></div>

        <div class="container-layout">

            <div class="container-header">
                <h1>Danh sách báo cáo</h1>
                <p>Xem các báo cáo ở đây</p>
            </div>

            <main class="main-container">

                <div class="document-card">

                    <div class="document-container">

                        <table class="document-table">
                            <thead>
                                <tr>
                                    <th>Người chia sẻ</th>
                                    <th>Tiêu đề</th>
                                    <th>Ngày nộp</th>
                                    <th>File đính kèm</th>
                                    <th>Link tài liệu</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>

                            <tbody id="reportTableBody">
                                <tr>
                                    <td colspan="6" style="text-align:center">Đang tải...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <a class="btn btn-pagination">
                            ← Trước
                        </a>

                        <span>
                            <a></a>
                            <span></span>
                        </span>

                        <a class="btn btn-pagination">
                            Sau →
                        </a>
                    </div>
                </div>

            </main>
            <div th:replace="~{cms/layout/footer :: footer}"></div>

        </div>
    </div>

    <!-- Modal chi tiết báo cáo -->
    <div th:replace="~{cms/document/document-detail :: reportModal}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tableBody = document.getElementById('reportTableBody');

            Promise.all([
                fetch('/api/report/my-reports').then(res => res.json()),
                fetch('/api/report/shared-with-me').then(res => res.json())
            ])
            .then(([myReports, sharedReports]) => {
                tableBody.innerHTML = '';

                const allReports = [];

                if (myReports.content && myReports.content.length > 0) {
                    allReports.push(...myReports.content);
                }

                if (sharedReports.content && sharedReports.content.length > 0) {
                    // Add reports shared with me that are not already in my reports
                    sharedReports.content.forEach(shared => {
                        if (!allReports.some(r => r.id === shared.id)) {
                            allReports.push(shared);
                        }
                    });
                }

                // Sort by createdAt descending
                allReports.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                if (allReports.length > 0) {
                    allReports.forEach(report => {
                        const row = document.createElement('tr');

                        const date = new Date(report.createdAt);
                        const formattedDate = date.toLocaleDateString('vi-VN');

                        const employeeName = report.employeeName || 'N/A';
                        const attachmentUrl = report.attachmentUrl || '';
                        const attachmentFiles = report.attachmentFiles || '';

                        // Hiển thị files đính kèm
                        let filesHtml = '<span>Không có</span>';
                        if (attachmentFiles) {
                            const filePaths = attachmentFiles.split(',');
                            filesHtml = filePaths.map(path => {
                                const filename = path.split('/').pop();
                                return '<a href="' + path + '" class="file-link" download>📎 ' + filename + '</a>';
                            }).join('<br>');
                        }

                        // Hiển thị link
                        const linkHtml = attachmentUrl ? 
                            '<a href="' + attachmentUrl + '" target="_blank" class="file-link">🔗 Mở link</a>' : 
                            '<span>Không có</span>';

                        row.innerHTML = 
                            '<td>' + employeeName + '</td>' +
                            '<td>' + report.title + '</td>' +
                            '<td>' + formattedDate + '</td>' +
                            '<td>' + filesHtml + '</td>' +
                            '<td>' + linkHtml + '</td>' +
                            '<td><button class="btn btn-detail" data-id="' + report.id + '">Chi tiết</button></td>';

                        tableBody.appendChild(row);
                    });

                    // Gắn sự kiện click cho các nút Chi tiết
                    document.querySelectorAll('.btn-detail').forEach(button => {
                        button.addEventListener('click', function() {
                            const reportId = this.getAttribute('data-id');
                            openReportDetail(reportId);
                        });
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center">Không có báo cáo nào</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error loading reports:', error);
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center">Lỗi khi tải danh sách báo cáo</td></tr>';
            });

            // Modal functions
            const modal = document.getElementById('reportModal');
            const closeBtn = modal.querySelector('.close-btn');

            closeBtn.onclick = function() {
                modal.style.display = 'none';
            };

            window.onclick = function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            };

            async function openReportDetail(reportId) {
                try {
                    const response = await fetch('/api/report/' + reportId);
                    if (!response.ok) {
                        throw new Error('Không thể tải chi tiết báo cáo');
                    }
                    const data = await response.json();

                    document.getElementById('modalTitle').textContent = data.title || '--';
                    document.getElementById('modalEmployee').textContent = data.employeeName || '--';

                    const date = data.createdAt ? new Date(data.createdAt) : null;
                    document.getElementById('modalDate').textContent = date ? date.toLocaleDateString('vi-VN') : '--';

                    document.getElementById('modalContent').textContent = data.content || '--';

                    // Hiển thị người được chia sẻ
                    const sharedUsersDiv = document.getElementById('modalSharedUsers');
                    if (data.sharedUserNames && data.sharedUserNames.length > 0) {
                        sharedUsersDiv.innerHTML = data.sharedUserNames.map(name => 
                            '<span class="shared-user-tag">' + name + '</span>'
                        ).join(' ');
                    } else {
                        sharedUsersDiv.innerHTML = '<span>Không có</span>';
                    }

                    // Hiển thị tập đính kèm
                    const filesDiv = document.getElementById('modalFiles');
                    if (data.attachmentFiles) {
                        const filePaths = data.attachmentFiles.split(',');
                        filesDiv.innerHTML = filePaths.map(path => {
                            const filename = path.split('/').pop();
                            return '<a href="' + path + '" class="file-link" download>📎 ' + filename + '</a>';
                        }).join('<br>');
                    } else {
                        filesDiv.innerHTML = '<span>Không có</span>';
                    }

                    // Hiển thị liên kết
                    const linkDiv = document.getElementById('modalLink');
                    if (data.attachmentUrl) {
                        linkDiv.innerHTML = '<a href="' + data.attachmentUrl + '" target="_blank" class="file-link">🔗 Mở link</a>';
                    } else {
                        linkDiv.innerHTML = '<span>Không có</span>';
                    }

                    modal.style.display = 'flex';
                } catch (error) {
                    console.error('Error loading report detail:', error);
                    alert('Lỗi khi tải chi tiết báo cáo');
                }
            }
        });
    </script>
</body>
</html>
