<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nộp báo cáo công việc</title>

    <link rel="stylesheet" th:href="@{/css/document/document-create.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="bg-image"></div>

    <div class="layout">

        <!-- SIDEBAR -->
        <div th:replace="~{cms/sidebar/sidebar-role :: sidebar}"></div>

        <!-- CONTENT -->
        <div class="container-layout">

            <!-- HEADER -->
            <div class="container-header">
                <h1>Nộp báo cáo công việc</h1>
                <p>Gửi báo cáo và chia sẻ cho nhân viên</p>
            </div>

            <main class="main-container">

                <!-- FORM CARD -->
                <section class="dashboard-card">

                    <div class="card-header">
                        <h2>Gửi báo cáo</h2>
                    </div>

                    <div class="card-body">

                        <form method="post" th:action="@{/report/create}" enctype="multipart/form-data">

                            <!-- Tiêu đề -->
                            <div class="form-group">
                                <label>Tiêu đề báo cáo</label>
                                <input type="text" name="title" placeholder="Nhập tiêu đề báo cáo..." required>
                            </div>

                            <!-- Nội dung -->
                            <div class="form-group">
                                <label>Nội dung báo cáo</label>
                                <textarea name="content" rows="5" placeholder="Nhập nội dung báo cáo..."
                                    required></textarea>
                            </div>

                            <!-- Người được chia sẻ -->
                            <div class="form-group">
                                <div class="shared-header">
                                    <label>Người được chia sẻ</label>
                                    <button type="button" id="filterToggleBtn" class="filter-icon-btn" title="Bộ lọc">
                                        <i class="fa-solid fa-filter"></i>
                                    </button>
                                </div>

                                <!-- Filter Panel -->
                                <div id="filterPanel" class="filter-panel" style="display:none;">
                                    <div class="filter-section">
                                        <span class="filter-label">Chuyên ngành</span>
                                        <div id="specializationFilters" class="filter-checkbox-group">
                                            <th:block th:each="spec : ${specializations}">
                                                <label class="filter-checkbox-label" th:if="${spec.name() != 'UNASSIGNED'}">
                                                    <input type="checkbox" class="spec-filter-cb"
                                                        th:data-spec="${spec.name()}"
                                                        checked>
                                                    <span th:text="${spec.displayName}"></span>
                                                </label>
                                            </th:block>
                                        </div>
                                    </div>
                                    <div class="filter-section">
                                        <span class="filter-label">Tên nhân viên</span>
                                        <input type="text" id="nameFilterInput" class="filter-text-input"
                                            placeholder="Nhập tên để lọc...">
                                    </div>
                                </div>

                                <div id="userCheckboxes" class="checkbox-container">
                                    <!-- Checkbox Tất cả -->
                                    <label class="checkbox-label checkbox-all-label">
                                        <input type="checkbox" id="selectAllCheckbox">
                                        <span><strong>Tất cả</strong></span>
                                    </label>
                                    <hr class="checkbox-divider">

                                    <!-- Danh sách nhân viên -->
                                    <th:block th:each="user : ${users}">
                                        <label class="checkbox-label employee-checkbox"
                                            th:attr="data-specialization=${user.specialization().name()}, data-name=${user.fullName()}">
                                            <input type="checkbox" name="sharedUserIds"
                                                th:value="${user.id}">
                                            <span th:text="${user.fullName()}"></span>
                                        </label>
                                    </th:block>

                                    <p class="placeholder-text" th:if="${#lists.isEmpty(users)}">
                                        Không có nhân viên nào
                                    </p>
                                </div>
                            </div>

                            <!-- Upload file -->
                            <div class="form-group">
                                <label>Tệp đính kèm</label>

                                <input type="file" name="files" multiple>
                            </div>

                            <!-- Link -->
                            <div class="form-group">
                                <label>Hoặc liên kết</label>

                                <input type="url" name="link" placeholder="https://drive.google.com/...">
                            </div>

                            <!-- BUTTON -->
                            <div class="form-actions">

                                <button type="submit" class="btn-primary">
                                    <i class="fa-regular fa-paper-plane"></i>
                                    Gửi báo cáo
                                </button>

                                <button type="reset" class="btn-secondary">
                                    Reset
                                </button>

                            </div>

                        </form>

                    </div>

                </section>

            </main>
            <div th:replace="~{cms/layout/footer :: footer}"></div>

        </div>
    </div>

    <!-- JS: Toggle all + Filter logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ===== 1. Select All checkbox =====
            const selectAllCb = document.getElementById('selectAllCheckbox');
            const employeeCbs = document.querySelectorAll('.employee-checkbox input[type="checkbox"]');

            if (selectAllCb) {
                selectAllCb.addEventListener('change', function() {
                    const isChecked = this.checked;
                    // Only toggle VISIBLE employee checkboxes
                    document.querySelectorAll('.employee-checkbox').forEach(function(label) {
                        if (label.style.display !== 'none') {
                            const cb = label.querySelector('input[type="checkbox"]');
                            if (cb) cb.checked = isChecked;
                        }
                    });
                });

                // If all individual checkboxes are checked, check "Select All"
                function updateSelectAllState() {
                    const visibleLabels = document.querySelectorAll('.employee-checkbox');
                    let allVisibleChecked = true;
                    let anyVisible = false;
                    visibleLabels.forEach(function(label) {
                        if (label.style.display !== 'none') {
                            anyVisible = true;
                            const cb = label.querySelector('input[type="checkbox"]');
                            if (cb && !cb.checked) allVisibleChecked = false;
                        }
                    });
                    if (selectAllCb) {
                        selectAllCb.checked = anyVisible && allVisibleChecked;
                    }
                }

                employeeCbs.forEach(function(cb) {
                    cb.addEventListener('change', updateSelectAllState);
                });
            }

            // ===== 2. Filter Panel Toggle =====
            const filterToggleBtn = document.getElementById('filterToggleBtn');
            const filterPanel = document.getElementById('filterPanel');

            if (filterToggleBtn && filterPanel) {
                filterToggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isVisible = filterPanel.style.display === 'block';
                    filterPanel.style.display = isVisible ? 'none' : 'block';
                });

                // Close panel when clicking outside
                document.addEventListener('click', function(e) {
                    if (!filterPanel.contains(e.target) && e.target !== filterToggleBtn && !filterToggleBtn.contains(e.target)) {
                        filterPanel.style.display = 'none';
                    }
                });
            }

            // ===== 3. Filter Logic =====
            const specCheckboxes = document.querySelectorAll('.spec-filter-cb');
            const nameInput = document.getElementById('nameFilterInput');
            const employeeLabels = document.querySelectorAll('.employee-checkbox');

            function applyFilters() {
                // Get selected specializations
                const selectedSpecs = [];
                specCheckboxes.forEach(function(cb) {
                    if (cb.checked) {
                        selectedSpecs.push(cb.getAttribute('data-spec'));
                    }
                });

                // Get name filter text
                const nameText = nameInput ? nameInput.value.trim().toLowerCase() : '';

                employeeLabels.forEach(function(label) {
                    const spec = label.getAttribute('data-specialization');
                    const name = (label.getAttribute('data-name') || '').toLowerCase();

                    // Check specialization match
                    const specMatch = selectedSpecs.length === 0 || selectedSpecs.includes(spec);

                    // Check name match
                    const nameMatch = nameText === '' || name.includes(nameText);

                    // AND logic: show only if both match
                    if (specMatch && nameMatch) {
                        label.style.display = '';
                    } else {
                        label.style.display = 'none';
                        // Uncheck hidden employees
                        const cb = label.querySelector('input[type="checkbox"]');
                        if (cb) cb.checked = false;
                    }
                });

                // Update "Select All" state after filtering
                if (selectAllCb) {
                    const visibleLabels = document.querySelectorAll('.employee-checkbox');
                    let allVisibleChecked = true;
                    let anyVisible = false;
                    visibleLabels.forEach(function(label) {
                        if (label.style.display !== 'none') {
                            anyVisible = true;
                            const cb = label.querySelector('input[type="checkbox"]');
                            if (cb && !cb.checked) allVisibleChecked = false;
                        }
                    });
                    selectAllCb.checked = anyVisible && allVisibleChecked;
                }
            }

            // Bind filter events
            specCheckboxes.forEach(function(cb) {
                cb.addEventListener('change', applyFilters);
            });
            if (nameInput) {
                nameInput.addEventListener('input', applyFilters);
            }

            // ===== 4. Reset form: clear filter panel state =====
            const resetBtn = document.querySelector('button[type="reset"]');
            if (resetBtn) {
                resetBtn.addEventListener('click', function() {
                    // Reset filter panel
                    if (filterPanel) filterPanel.style.display = 'none';
                    specCheckboxes.forEach(function(cb) { cb.checked = true; });
                    if (nameInput) nameInput.value = '';
                    // Show all employees
                    employeeLabels.forEach(function(label) { label.style.display = ''; });
                    // Uncheck all
                    employeeCbs.forEach(function(cb) { cb.checked = false; });
                    if (selectAllCb) selectAllCb.checked = false;
                });
            }
        });
    </script>

</body>

</html>
