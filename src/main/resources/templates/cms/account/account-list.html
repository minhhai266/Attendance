<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Danh sách tài khoản</title>
    <link rel="stylesheet" th:href="@{/css/account/account-list.css}">

</head>

<body>
    <div class="bg-image"></div>
    <div class="layout">
        <div th:replace="~{cms/sidebar/sidebar-role :: sidebar}"></div>

        <div class="container-layout">

            <div class="container-header">
                <h1>Danh sach tài khoản</h1>
                <p>Quản lý các tài khoản trong hệ thống</p>
            </div>

            <main class="main-container">
                <section class="dashboard-card">

                    <div class="card-header">
                        <h2>Quản lý người dùng</h2>
                        <button class="add-btn">+ Thêm người dùng</button>
                    </div>

                    <div class="search-box">
                        <input type="text" placeholder="Tìm kiếm người dùng...">
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Người dùng</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${users == null or users.content.isEmpty()}">
                                <td colspan="5">Chưa có tài khoản nào.</td>
                            </tr>
                            <tr th:each="users : ${users.content}">
                                <td>
                                    <div class="user">
                                        <div class="avatar">A</div>
                                        <strong th:text="${users.fullName()}">Nguyễn Văn A</strong>
                                    </div>
                                </td>
                                <td th:text="${users.email()}">nguyenvana@company.com</td>
                                <td><span th:text="${users.role()}" class="role">Nhân viên</span></td>
                                <td><span
                                        th:text="${users.status() == 'ACTIVE' ? 'Hoạt động' : (users.status() == 'PENDING' ? 'Chờ duyệt' : 'Bị khóa')}"
                                        th:class="${'status ' + (users.status() == 'ACTIVE' ? 'active' : 'inactive')}">Hoạt động</span>
                                </td>
                                <td>
                                    <div class="actions"
                                        th:with="canManage=${users.username() != currentUsername and users.role() != 'ADMIN'}">

                                        <div class="role-change" th:if="${canManage}">
                                            <form th:action="@{/admin/accounts/change-role/{id}(id=${users.id()})}" method="post" class="role-change-form">
                                                <select name="newRole" class="role-select">
                                                    <option th:each="role : ${availableRoles}"
                                                            th:value="${role.name()}"
                                                            th:text="${role.name()}"
                                                            th:selected="${role.name() == users.role()}">
                                                    </option>
                                                </select>
                                                <button type="button" class="icon-btn btn-role" onclick="confirmRoleChange(this)">Đổi quyền</button>
                                            </form>
                                        </div>
                                        <div th:if="${canManage and users.status() == 'ACTIVE'}">
                                            <form th:action="@{/admin/accounts/deactivate/{id}(id=${users.id()})}" method="post">
                                                <button class="icon-btn lock">🔒</button>
                                            </form>
                                        </div>
                                        <div th:if="${canManage and users.status() != 'ACTIVE'}">
                                            <form th:action="@{/admin/accounts/activate/{id}(id=${users.id()})}" method="post">
                                                <button class="icon-btn unlock">🔓</button>
                                            </form>
                                        </div>
                                        <span th:unless="${canManage}" class="action-note">Không thể thao tác</span>
                                    </div>
                                </td>
                            </tr>


                        </tbody>
                    </table>

                    <!-- PAGINATION -->
                    <div class="pagination" th:if="${users.totalPages > 1}">
                        <a th:if="${users.hasPrevious()}"
                           th:href="@{/admin/accounts(page=${users.number - 1})}"
                           class="btn btn-pagination">← Trước</a>

                        <span class="page-info">
                            <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                               th:if="${i == users.number}"
                               th:href="@{/admin/accounts(page=${i})}"
                               class="page-link active" th:text="${i + 1}">1</a>
                            <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                               th:unless="${i == users.number}"
                               th:href="@{/admin/accounts(page=${i})}"
                               class="page-link" th:text="${i + 1}">1</a>
                        </span>

                        <a th:if="${users.hasNext()}"
                           th:href="@{/admin/accounts(page=${users.number + 1})}"
                           class="btn btn-pagination">Sau →</a>
                    </div>
                </section>
            </main>
            <!-- FOOTER -->
            <div th:replace="~{cms/layout/footer :: footer}"></div>
        </div>

    </div>


    <!-- CONFIRMATION MODAL FOR ROLE CHANGE -->
    <div id="roleConfirmModal" class="detail-modal">
        <div class="detail-content" style="max-width: 480px;">
            <div class="detail-header">
                <h2>Xác nhận đổi quyền</h2>
                <button class="close-btn" onclick="closeRoleConfirm()">✕</button>
            </div>
            <div class="detail-body" style="grid-template-columns: 1fr;">
                <p id="roleConfirmMessage" style="color: #e2e8f0; font-size: 1rem; line-height: 1.6;"></p>
            </div>
            <div class="detail-header" style="border-top: 1px solid var(--border); border-bottom: none; justify-content: flex-end; gap: 12px;">
                <button class="icon-btn" style="background: var(--bg-form);" onclick="closeRoleConfirm()">Hủy</button>
                <button class="icon-btn btn-role" id="roleConfirmSubmit" style="min-width: 100px;">Xác nhận</button>
            </div>
        </div>
    </div>

    <div id="accountModal" class="detail-modal">

        <div class="detail-content">

            <div class="detail-header">

                <h2>Thông tin cá nhân</h2>

                <button class="close-btn" onclick="closeAccountDetail()">

                    ✕

                </button>

            </div>

            <div class="detail-body">

                <div class="detail-item">
                    <label>Họ và tên</label>
                    <p id="detailFullName"></p>
                </div>

                <div class="detail-item">
                    <label>Email</label>
                    <p id="detailEmail"></p>
                </div>

                <div class="detail-item">
                    <label>Số điện thoại</label>
                    <p id="detailPhone"></p>
                </div>

                <div class="detail-item">
                    <label>Phòng ban</label>
                    <p id="detailDepartment"></p>
                </div>

                <div class="detail-item">
                    <label>Vai trò</label>
                    <p id="detailRole"></p>
                </div>

                <div class="detail-item">
                    <label>Trạng thái</label>
                    <span id="detailStatus"></span>
                </div>

            </div>

        </div>

    </div>

<script>
    let pendingForm = null;

    function confirmRoleChange(button) {
        const form = button.closest('.role-change-form');
        const select = form.querySelector('.role-select');
        const selectedRole = select.options[select.selectedIndex].text;
        const row = form.closest('tr');
        const userName = row.querySelector('strong').textContent;

        pendingForm = form;

        document.getElementById('roleConfirmMessage').textContent =
            'Bạn có chắc chắn muốn đổi quyền của "' + userName + '" thành ' + selectedRole + '?';

        document.getElementById('roleConfirmModal').style.display = 'flex';
        document.getElementById('roleConfirmSubmit').onclick = function() {
            if (pendingForm) {
                pendingForm.submit();
            }
        };
    }

    function closeRoleConfirm() {
        document.getElementById('roleConfirmModal').style.display = 'none';
        pendingForm = null;
    }

    // Close modal when clicking outside
    document.getElementById('roleConfirmModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeRoleConfirm();
        }
    });
</script>

</body>

</html>
